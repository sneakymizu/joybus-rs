[package]
name = "rust64"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[[bin]]
name = "rust64"
test = false
bench = false

[dependencies]
embassy-executor = "0.8.0"
embassy-time = "0.4.0"
ufmt = "0.2.0"

[profile.dev]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
